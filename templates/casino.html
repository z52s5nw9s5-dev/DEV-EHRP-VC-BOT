<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta name="theme-color" content="#050505">

    <title>EHRP/VC Casino</title>

    <link
        rel="stylesheet"
        href="/static/casino.css"
    >
</head>

<body>

    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div class="glow"></div>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

        <div class="brand">

            <span>♛</span>

            <div>

                <b>EHRP/VC</b>

                <small>
                    PREMIUM CASINO
                </small>

            </div>

        </div>


        <div class="wallet">

            💰

            <span id="balance">
                1.000
            </span>

            <small>
                EHRP COINS
            </small>

        </div>

    </header>


    <!-- =====================================================
         MAIN CASINO
    ====================================================== -->

    <main>


        <!-- HERO -->

        <section class="hero">

            <div class="eyebrow">
                WELCOME TO THE NIGHT
            </div>

            <h1>
                EHRP
                <em>
                    CASINO
                </em>
            </h1>

            <p>
                Dein persönlicher Casino-Floor.
                Wähle deinen Einsatz und starte direkt.
            </p>


            <!-- BET SELECT -->

            <div
                class="bets"
                id="bets"
            ></div>

        </section>


        <!-- =================================================
             PLAYER STATS
        ================================================== -->

        <section class="stats">

            <div>

                <small>
                    SPIELE
                </small>

                <b id="games">
                    0
                </b>

            </div>


            <div>

                <small>
                    SIEGE
                </small>

                <b id="wins">
                    0
                </b>

            </div>


            <div>

                <small>
                    GRÖSSTER GEWINN
                </small>

                <b id="biggest">
                    0
                </b>

            </div>


            <div>

                <small>
                    WINRATE
                </small>

                <b id="rate">
                    0%
                </b>

            </div>

        </section>


        <!-- =================================================
             CASINO FLOOR
        ================================================== -->

        <h2>
            CASINO FLOOR
        </h2>


        <section
            class="grid"
            id="gamesGrid"
        ></section>


    </main>


    <!-- =====================================================
         GAME WINDOW
    ====================================================== -->

    <div
        class="modal hidden"
        id="modal"
    >

        <div class="table">


            <!-- CLOSE -->

            <button
                class="close"
                type="button"
                onclick="closeGame()"
            >
                ×
            </button>


            <!-- GAME ICON -->

            <div
                id="gameIcon"
                class="gameIcon"
            >
                🎰
            </div>


            <!-- GAME NAME -->

            <h2 id="gameTitle">
                SLOTS
            </h2>


            <!-- GAME DISPLAY -->

            <div
                id="machine"
                class="machine"
            >
                ❔　❔　❔
            </div>


            <!-- RESULT -->

            <p id="result">
                Einsatz wählen und spielen.
            </p>


            <!-- PLAY -->

            <button
                class="play"
                id="playBtn"
                type="button"
            >
                JETZT SPIELEN
            </button>


        </div>

    </div>


    <!-- =====================================================
         PLAYER CONNECTION
    ====================================================== -->

    <script>

        window.USER_ID =
            new URLSearchParams(
                window.location.search
            ).get("uid")
            || "demo";

    </script>


    <!-- =====================================================
         CASINO ENGINE
    ====================================================== -->

    <script src="/static/casino.js"></script>


</body>
</html>
