<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta name="theme-color" content="#050505">

    <title>EHRP/VC Casino</title>

    <link
        rel="stylesheet"
        href="/static/casino.css?v=20260904-1"
    >
</head>


<body>

    <!-- =====================================================
         ENTRANCE
    ====================================================== -->

    <section
        id="casinoEntrance"
        class="casino-entrance"
    >

        <div class="entrance-image-wrap">

            <img
                src="/assets/casino_entrance.png.PNG"
                class="entrance-image"
                alt="EHRP/VC Casino"
                draggable="false"
            >

            <button
                id="enterCasino"
                class="entrance-click"
                type="button"
                aria-label="Casino betreten"
            ></button>

        </div>


        <div
            id="entranceFade"
            class="entrance-fade"
        >

            <div class="entrance-loader">

                <div class="loader-crown">
                    ♛
                </div>

                <strong>
                    EHRP/VC
                </strong>

                <small id="loaderText">
                    CASINO
                </small>

            </div>

        </div>

    </section>



    <!-- =====================================================
         CASINO
    ====================================================== -->

    <div
        id="casinoApp"
        class="casino-app"
        hidden
    >

        <header class="casino-header">

            <div class="casino-brand">

                <div class="brand-crown">
                    ♛
                </div>

                <div>

                    <strong>
                        EHRP/VC
                    </strong>

                    <small>
                        PREMIUM CASINO
                    </small>

                </div>

            </div>


            <div
                id="discordProfile"
                class="casino-wallet"
            >

                <img
                    id="discordAvatar"
                    src=""
                    alt=""
                    style="
                        width: 34px;
                        height: 34px;
                        border-radius: 50%;
                        object-fit: cover;
                        display: none;
                    "
                >

                <div>

                    <strong id="discordName">
                        Discord
                    </strong>

                    <small>
                        SPIELER
                    </small>

                </div>

            </div>


            <div class="casino-wallet">

                <span>
                    💰
                </span>

                <div>

                    <strong id="balance">
                        0
                    </strong>

                    <small>
                        EHRP COINS
                    </small>

                </div>

            </div>

        </header>



        <main class="casino-main">


            <section class="casino-hero">

                <div class="hero-label">
                    EHRP/VC PREMIUM CASINO
                </div>

                <h1>
                    EHRP
                    <span>
                        CASINO
                    </span>
                </h1>

                <p>
                    Wähle deinen Einsatz und starte dein Spiel.
                </p>


                <div
                    id="bets"
                    class="bet-grid"
                ></div>

            </section>



            <section class="casino-stats">

                <article>

                    <small>
                        SPIELE
                    </small>

                    <strong id="games">
                        0
                    </strong>

                </article>


                <article>

                    <small>
                        SIEGE
                    </small>

                    <strong id="wins">
                        0
                    </strong>

                </article>


                <article>

                    <small>
                        GRÖSSTER GEWINN
                    </small>

                    <strong id="biggest">
                        0
                    </strong>

                </article>


                <article>

                    <small>
                        WINRATE
                    </small>

                    <strong id="rate">
                        0%
                    </strong>

                </article>

            </section>



            <section class="casino-floor">

                <div class="floor-heading">

                    <div>

                        <small>
                            EHRP/VC
                        </small>

                        <h2>
                            CASINO FLOOR
                        </h2>

                    </div>

                    <span>
                        9 SPIELE
                    </span>

                </div>


                <div
                    id="gamesGrid"
                    class="games-grid"
                ></div>

            </section>


        </main>

    </div>



    <!-- =====================================================
         GAME MODAL
    ====================================================== -->

    <div
        id="modal"
        class="game-modal hidden"
    >

        <section class="game-window">

            <button
                id="closeGameButton"
                class="game-close"
                type="button"
                aria-label="Spiel schließen"
            >
                ×
            </button>


            <div class="game-heading">

                <div
                    id="gameIcon"
                    class="game-icon"
                >
                    🎰
                </div>

                <div>

                    <small>
                        EHRP/VC CASINO
                    </small>

                    <h2 id="gameTitle">
                        SLOTS
                    </h2>

                </div>

            </div>



            <div
                id="machine"
                class="game-machine"
            ></div>



            <p
                id="result"
                class="game-result"
            >
                Einsatz wählen und spielen.
            </p>



            <button
                id="playBtn"
                class="game-play"
                type="button"
            >
                JETZT SPIELEN
            </button>

        </section>

    </div>



    <!-- =====================================================
         AUTH + ENTRANCE
    ====================================================== -->

    <script>

        (() => {

            const entrance =
                document.getElementById(
                    "casinoEntrance"
                );

            const button =
                document.getElementById(
                    "enterCasino"
                );

            const image =
                document.querySelector(
                    ".entrance-image"
                );

            const fade =
                document.getElementById(
                    "entranceFade"
                );

            const app =
                document.getElementById(
                    "casinoApp"
                );

            const loaderText =
                document.getElementById(
                    "loaderText"
                );


            let opening = false;


            async function getDiscordUser() {

                try {

                    const response =
                        await fetch(
                            "/api/me",
                            {
                                credentials:
                                    "same-origin"
                            }
                        );

                    const data =
                        await response.json();

                    return data;

                } catch (error) {

                    console.error(
                        "Discord Status konnte nicht geladen werden:",
                        error
                    );

                    return {
                        ok: false,
                        logged_in: false
                    };
                }
            }


            function renderDiscordUser(user) {

                if (!user) {
                    return;
                }


                const name =
                    document.getElementById(
                        "discordName"
                    );

                const avatar =
                    document.getElementById(
                        "discordAvatar"
                    );


                if (name) {

                    name.textContent =
                        user.username ||
                        "Discord Spieler";
                }


                if (
                    avatar &&
                    user.avatar_url
                ) {

                    avatar.src =
                        user.avatar_url;

                    avatar.style.display =
                        "block";
                }
            }


            async function openCasino() {

                if (opening) {
                    return;
                }

                opening = true;


                if (navigator.vibrate) {
                    navigator.vibrate(30);
                }


                button.disabled = true;

                entrance.classList.add(
                    "entrance-opening"
                );


                window.setTimeout(
                    () => {

                        fade.classList.add(
                            "entrance-fade-visible"
                        );

                    },
                    250
                );


                loaderText.textContent =
                    "DISCORD LOGIN";


                const auth =
                    await getDiscordUser();


                if (!auth.logged_in) {

                    sessionStorage.setItem(
                        "ehrp_open_after_login",
                        "1"
                    );

                    window.location.href =
                        "/auth/discord/login";

                    return;
                }


                renderDiscordUser(
                    auth.user
                );


                loaderText.textContent =
                    "CASINO WIRD GELADEN";


                window.setTimeout(
                    () => {

                        app.hidden = false;

                        window.scrollTo(
                            0,
                            0
                        );

                    },
                    350
                );


                window.setTimeout(
                    () => {

                        entrance.remove();

                        document.body.classList.add(
                            "casino-open"
                        );

                    },
                    700
                );
            }


            button.addEventListener(
                "click",
                openCasino
            );


            image.addEventListener(
                "click",
                openCasino
            );


            async function restoreAfterLogin() {

                const shouldOpen =
                    sessionStorage.getItem(
                        "ehrp_open_after_login"
                    );


                if (shouldOpen !== "1") {
                    return;
                }


                const auth =
                    await getDiscordUser();


                if (!auth.logged_in) {
                    return;
                }


                sessionStorage.removeItem(
                    "ehrp_open_after_login"
                );


                renderDiscordUser(
                    auth.user
                );


                openCasino();
            }


            restoreAfterLogin();

        })();

    </script>



    <!-- =====================================================
         CASINO ENGINE
    ====================================================== -->

    <script
        src="/static/casino.js?v=20260904-1"
    ></script>

</body>

</html>
