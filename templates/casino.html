<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta name="theme-color" content="#050505">

    <title>EHRP/VC Casino</title>

    <link
        rel="stylesheet"
        href="/static/casino.css?v=20260901-1"
    >
</head>


<body>

    <!-- =====================================================
         ENTRANCE
    ====================================================== -->

    <section
        id="casinoEntrance"
        class="casino-entrance"
    >

        <div class="entrance-image-wrap">

            <img
                src="/assets/casino_entrance.png.PNG"
                class="entrance-image"
                alt="EHRP/VC Casino"
                draggable="false"
            >

            <!--
                Große Klickfläche über dem unteren
                CASINO-BETRETEN-Bereich des Originalbildes.
            -->

            <button
                id="enterCasino"
                class="entrance-click"
                type="button"
                aria-label="Casino betreten"
            ></button>

        </div>


        <div
            id="entranceFade"
            class="entrance-fade"
        >

            <div class="entrance-loader">

                <div class="loader-crown">
                    ♛
                </div>

                <strong>
                    EHRP/VC
                </strong>

                <small>
                    CASINO
                </small>

            </div>

        </div>

    </section>



    <!-- =====================================================
         CASINO
    ====================================================== -->

    <div
        id="casinoApp"
        class="casino-app"
        hidden
    >

        <!-- HEADER -->

        <header class="casino-header">

            <div class="casino-brand">

                <div class="brand-crown">
                    ♛
                </div>

                <div>

                    <strong>
                        EHRP/VC
                    </strong>

                    <small>
                        PREMIUM CASINO
                    </small>

                </div>

            </div>


            <div class="casino-wallet">

                <span>
                    💰
                </span>

                <div>

                    <strong id="balance">
                        1.000
                    </strong>

                    <small>
                        EHRP COINS
                    </small>

                </div>

            </div>

        </header>



        <!-- MAIN -->

        <main class="casino-main">


            <!-- HERO -->

            <section class="casino-hero">

                <div class="hero-label">
                    EHRP/VC PREMIUM CASINO
                </div>

                <h1>
                    EHRP
                    <span>
                        CASINO
                    </span>
                </h1>

                <p>
                    Wähle deinen Einsatz und starte dein Spiel.
                </p>


                <div
                    id="bets"
                    class="bet-grid"
                ></div>

            </section>



            <!-- STATS -->

            <section class="casino-stats">

                <article>

                    <small>
                        SPIELE
                    </small>

                    <strong id="games">
                        0
                    </strong>

                </article>


                <article>

                    <small>
                        SIEGE
                    </small>

                    <strong id="wins">
                        0
                    </strong>

                </article>


                <article>

                    <small>
                        GRÖSSTER GEWINN
                    </small>

                    <strong id="biggest">
                        0
                    </strong>

                </article>


                <article>

                    <small>
                        WINRATE
                    </small>

                    <strong id="rate">
                        0%
                    </strong>

                </article>

            </section>



            <!-- FLOOR -->

            <section class="casino-floor">

                <div class="floor-heading">

                    <div>

                        <small>
                            EHRP/VC
                        </small>

                        <h2>
                            CASINO FLOOR
                        </h2>

                    </div>

                    <span>
                        9 SPIELE
                    </span>

                </div>


                <div
                    id="gamesGrid"
                    class="games-grid"
                ></div>

            </section>


        </main>

    </div>



    <!-- =====================================================
         GAME MODAL
    ====================================================== -->

    <div
        id="modal"
        class="game-modal hidden"
    >

        <section class="game-window">

            <button
                id="closeGameButton"
                class="game-close"
                type="button"
                aria-label="Spiel schließen"
            >
                ×
            </button>


            <div class="game-heading">

                <div
                    id="gameIcon"
                    class="game-icon"
                >
                    🎰
                </div>

                <div>

                    <small>
                        EHRP/VC CASINO
                    </small>

                    <h2 id="gameTitle">
                        SLOTS
                    </h2>

                </div>

            </div>



            <div
                id="machine"
                class="game-machine"
            ></div>



            <p
                id="result"
                class="game-result"
            >
                Einsatz wählen und spielen.
            </p>



            <button
                id="playBtn"
                class="game-play"
                type="button"
            >
                JETZT SPIELEN
            </button>

        </section>

    </div>



    <!-- =====================================================
         USER
    ====================================================== -->

    <script>

        window.USER_ID =
            new URLSearchParams(
                window.location.search
            ).get("uid")
            || "demo";

    </script>



    <!-- =====================================================
         ENTRANCE
    ====================================================== -->

    <script>

        (() => {

            const entrance =
                document.getElementById(
                    "casinoEntrance"
                );

            const button =
                document.getElementById(
                    "enterCasino"
                );

            const fade =
                document.getElementById(
                    "entranceFade"
                );

            const app =
                document.getElementById(
                    "casinoApp"
                );


            let opening = false;


            function openCasino() {

                if (opening) {
                    return;
                }


                opening = true;


                if (navigator.vibrate) {

                    navigator.vibrate(30);

                }


                button.disabled = true;

                entrance.classList.add(
                    "entrance-opening"
                );


                window.setTimeout(
                    () => {

                        fade.classList.add(
                            "entrance-fade-visible"
                        );

                    },
                    300
                );


                window.setTimeout(
                    () => {

                        app.hidden = false;

                        window.scrollTo(
                            0,
                            0
                        );

                    },
                    850
                );


                window.setTimeout(
                    () => {

                        entrance.remove();

                        document.body.classList.add(
                            "casino-open"
                        );

                    },
                    1150
                );

            }


            button.addEventListener(
                "click",
                openCasino
            );


            /*
                FALLBACK:
                Auch ein Tipp auf das Originalbild öffnet
                das Casino. Der User kann den Button dadurch
                auf Mobile nicht mehr "verfehlen".
            */

            document
                .querySelector(
                    ".entrance-image"
                )
                .addEventListener(
                    "click",
                    openCasino
                );

        })();

    </script>



    <!-- =====================================================
         CASINO ENGINE
    ====================================================== -->

    <script
        src="/static/casino.js?v=20260901-1"
    ></script>

</body>

</html>
