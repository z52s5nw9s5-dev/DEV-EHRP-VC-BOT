<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8">

    <meta

    <link

        href="/static/casino.css?v=20260831-01"

<body class="entrance-active">


    <!-- =====================================================
         CASINO ENTRANCE
    ====================================================== -->

    <section
        id="casinoEntrance"
        class="original-casino-entrance"
    >

        <img
            src="/assets/casino_entrance.png.PNG?v=20260831-01"
            alt="EHRP/VC Casino"
            class="original-entrance-image"
            draggable="false"
        >


        <div class="original-particles">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>


        <button
            id="enterCasinoButton"
            class="original-enter-button"
            type="button"
            aria-label="Casino betreten"
        ></button>


        <div
            id="casinoTransition"
            class="original-transition"
        >

            <div class="transition-logo">
                ♛
            </div>

            <div class="transition-name">
                EHRP/VC
            </div>

        </div>

    </section>



    <!-- =====================================================
         CASINO APP
    ====================================================== -->

    <div
        id="casinoApp"
        class="casino-app casino-app-hidden"
    >

        <div class="glow"></div>


        <!-- HEADER -->

        <header>

            <div class="brand">

                <span>
                    ♛
                </span>

                <div>

                    <b>
                        EHRP/VC
                    </b>

                    <small>
                        PREMIUM CASINO
                    </small>

                </div>

            </div>


            <div class="wallet">

                💰

                <span id="balance">
                    1.000
                </span>

                <small>
                    EHRP COINS
                </small>

            </div>

        </header>



        <!-- =================================================
             MAIN
        ================================================== -->

        <main>


            <!-- HERO -->

            <section class="hero">

                <div class="eyebrow">
                    WILLKOMMEN IM EHRP/VC CASINO
                </div>


                <h1>

                    EHRP

                    <em>
                        CASINO
                    </em>

                </h1>


                <p>
                    Dein persönlicher Casino-Floor.
                    Wähle deinen Einsatz und starte direkt.
                </p>


                <div
                    class="bets"
                    id="bets"
                ></div>

            </section>



            <!-- =================================================
                 STATS
            ================================================== -->

            <section class="stats">

                <div>

                    <small>
                        SPIELE
                    </small>

                    <b id="games">
                        0
                    </b>

                </div>


                <div>

                    <small>
                        SIEGE
                    </small>

                    <b id="wins">
                        0
                    </b>

                </div>


                <div>

                    <small>
                        GRÖSSTER GEWINN
                    </small>

                    <b id="biggest">
                        0
                    </b>

                </div>


                <div>

                    <small>
                        WINRATE
                    </small>

                    <b id="rate">
                        0%
                    </b>

                </div>

            </section>



            <!-- =================================================
                 FLOOR
            ================================================== -->

            <h2>
                CASINO FLOOR
            </h2>


            <section
                class="grid"
                id="gamesGrid"
            ></section>


        </main>

    </div>



    <!-- =====================================================
         GAME MODAL
    ====================================================== -->

    <div
        class="modal hidden"
        id="modal"
    >

        <div class="table">


            <button
                class="close"
                type="button"
                onclick="closeGame()"
                aria-label="Schließen"
            >
                ×
            </button>


            <div
                id="gameIcon"
                class="gameIcon"
            >
                🎰
            </div>


            <h2 id="gameTitle">
                SLOTS
            </h2>


            <div
                id="machine"
                class="machine"
            >
                ❔　❔　❔
            </div>


            <p id="result">
                Einsatz wählen und spielen.
            </p>


            <button
                class="play"
                id="playBtn"
                type="button"
            >
                JETZT SPIELEN
            </button>


        </div>

    </div>



    <!-- =====================================================
         USER
    ====================================================== -->

    <script>

        window.USER_ID =
            new URLSearchParams(
                window.location.search
            ).get("uid")
            || "demo";

    </script>



    <!-- =====================================================
         ENTRANCE ENGINE
    ====================================================== -->

    <script>

        const entrance =
            document.getElementById(
                "casinoEntrance"
            );

        const enterButton =
            document.getElementById(
                "enterCasinoButton"
            );

        const transition =
            document.getElementById(
                "casinoTransition"
            );

        const casinoApp =
            document.getElementById(
                "casinoApp"
            );


        let casinoOpening = false;


        enterButton.addEventListener(
            "click",
            function () {

                if (casinoOpening) {
                    return;
                }


                casinoOpening = true;


                if (navigator.vibrate) {

                    navigator.vibrate(35);

                }


                entrance.classList.add(
                    "original-opening"
                );


                setTimeout(
                    function () {

                        transition.classList.add(
                            "original-transition-visible"
                        );

                    },
                    850
                );


                setTimeout(
                    function () {

                        casinoApp.classList.remove(
                            "casino-app-hidden"
                        );

                        casinoApp.classList.add(
                            "casino-app-visible"
                        );

                    },
                    1600
                );


                setTimeout(
                    function () {

                        entrance.style.display =
                            "none";

                        document.body.classList.remove(
                            "entrance-active"
                        );

                        document.body.classList.add(
                            "casino-open"
                        );

                    },
                    2100
                );

            }
        );

    </script>



    <!-- =====================================================
         CASINO ENGINE — CACHE BUSTER
    ====================================================== -->

    <script
        src="/static/casino.js?v=20260831-01"
    ></script>


</body>

</html>
